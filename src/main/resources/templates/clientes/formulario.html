<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head(${editando} ? 'Editar Cliente' : 'Nuevo Cliente')}"></head>

<!-- Tom Select — buscador de municipios -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tom-select/2.3.1/css/tom-select.bootstrap5.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tom-select/2.3.1/js/tom-select.complete.min.js"></script>
<style>
    .ts-wrapper { width: 100%; }
    .ts-control {
        border-radius: 8px !important;
        font-size: 13px !important;
        padding: 8px 12px !important;
        box-shadow: none !important;
    }
    .ts-dropdown { border-radius: 8px !important; font-size: 13px !important; z-index: 9999 !important; box-shadow: 0 8px 24px rgba(0,0,0,0.12) !important; }
</style>

<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>

<div class="main-content">

    <!-- Topbar -->
    <div class="topbar">
        <div>
            <div class="topbar-title"
                 th:text="${editando} ? ' Editar Cliente' : ' Nuevo Cliente'">
            </div>
            <div class="topbar-sub"
                 th:text="${editando} ? ('Modificando: ' + cliente.nombre) : 'Completá los datos del cliente'">
            </div>
        </div>
        <div class="topbar-actions">
            <a th:href="@{/clientes}" class="btn btn-secondary">← Volver a clientes</a>
        </div>
    </div>

    <div class="page-body">

        <!-- Error general -->
        <div th:if="${mensajeError}" class="alert alert--danger">
             <span th:text="${mensajeError}"></span>
        </div>

        <!-- Formulario -->
        <div style="background:var(--gris-oscuro);border:1px solid var(--gris-borde);border-radius:12px;overflow:hidden;max-width:860px">

            <!-- Header del form -->
            <div style="padding:16px 24px;background:rgba(39,194,201,0.08);border-bottom:1px solid var(--gris-borde)">
                <div style="font-size:15px;font-weight:700"
                     th:text="${editando} ? ' Editando cliente' : ' Registrar nuevo cliente'">
                </div>
            </div>

            <form th:action="@{/clientes/guardar}"
                  th:object="${cliente}"
                  method="post"
                  style="padding:24px">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:field="*{idCliente}"/>

                <!-- ── SECCIÓN: Datos personales ─────────────────── -->
                <div style="font-size:12px;font-weight:700;color:var(--turquesa);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px">
                    👤 Datos Personales
                </div>

                <!-- Nombre -->
                <div class="form-group">
                    <label class="form-label">Nombre completo *</label>
                    <input type="text"
                           th:field="*{nombre}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('nombre')} ? ' is-invalid' : ''"
                           placeholder="Nombre y apellidos completos"
                           required>
                    <div th:if="${#fields.hasErrors('nombre')}"
                         class="text-sm"
                         style="color:var(--rojo);margin-top:4px"
                         th:errors="*{nombre}">
                    </div>
                </div>

                <div class="form-row form-row-3">
                    <!-- DPI -->
                    <div class="form-group">
                        <label class="form-label">DPI (CUI)</label>
                        <input type="text"
                               th:field="*{dpi}"
                               class="form-control"
                               placeholder="2901234567890"
                               maxlength="13">
                    </div>

                    <!-- NIT -->
                    <div class="form-group">
                        <label class="form-label">NIT</label>
                        <input type="text"
                               th:field="*{nit}"
                               class="form-control"
                               placeholder="CF o número NIT">
                    </div>

                    <!-- Fecha nacimiento -->
                    <div class="form-group">
                        <label class="form-label">Fecha de nacimiento</label>
                        <input type="date"
                               id="fechaNacimiento"
                               th:field="*{fechaNacimiento}"
                               class="form-control"
                               onchange="calcularEdad()">
                    </div>
                </div>

                <div class="form-row form-row-3">
                    <!-- Sexo -->
                    <div class="form-group">
                        <label class="form-label">Sexo</label>
                        <select th:field="*{sexo}" class="form-select">
                            <option value="">No especificado</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Femenino">Femenino</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>

                    <!-- Edad -->
                    <div class="form-group">
                        <label class="form-label">Edad</label>
                        <input type="number"
                               id="edad"
                               th:field="*{edad}"
                               class="form-control"
                               min="0" max="120"
                               placeholder="Ej: 28">
                    </div>

                    <!-- Ocupación -->
                    <div class="form-group">
                        <label class="form-label">Ocupación</label>
                        <input type="text"
                               th:field="*{ocupacion}"
                               class="form-control"
                               placeholder="Ej: Estudiante, Maestro, Ingeniero...">
                    </div>
                </div>

                <!-- ── SECCIÓN: Contacto ──────────────────────────── -->
                <div style="font-size:12px;font-weight:700;color:var(--turquesa);text-transform:uppercase;letter-spacing:1px;margin:20px 0 14px">
                     Contacto
                </div>

                <div class="form-row form-row-3">
                    <div class="form-group">
                        <label class="form-label">Teléfono principal</label>
                        <input type="text"
                               th:field="*{telefono}"
                               class="form-control"
                               placeholder="5555-0001">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Teléfono alterno / WhatsApp</label>
                        <input type="text"
                               th:field="*{telefono2}"
                               class="form-control"
                               placeholder="5555-0002">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email"
                               th:field="*{correo}"
                               class="form-control"
                               placeholder="correo@ejemplo.com">
                    </div>
                </div>

                <!-- ── SECCIÓN: Dirección ────────────────────────── -->
                <div style="font-size:12px;font-weight:700;color:var(--turquesa);text-transform:uppercase;letter-spacing:1px;margin:20px 0 14px">
                     Dirección
                </div>

                <div class="form-group">
                    <label class="form-label">Dirección completa</label>
                    <input type="text"
                           th:field="*{direccion}"
                           class="form-control"
                           placeholder="Calle, avenida, número de casa o apartamento...">
                </div>

                <div class="form-row form-row-3">
                    <!-- Departamento -->
                    <div class="form-group">
                        <label class="form-label">Departamento</label>
                        <select th:field="*{departamento}" id="departamento" class="form-select" onchange="cargarMunicipiosDireccion()">
                            <option value="">— Seleccionar —</option>
                            <option value="Guatemala">Guatemala</option>
                            <option value="Alta Verapaz">Alta Verapaz</option>
                            <option value="Baja Verapaz">Baja Verapaz</option>
                            <option value="Chimaltenango">Chimaltenango</option>
                            <option value="Chiquimula">Chiquimula</option>
                            <option value="El Progreso">El Progreso</option>
                            <option value="Escuintla">Escuintla</option>
                            <option value="Huehuetenango">Huehuetenango</option>
                            <option value="Izabal">Izabal</option>
                            <option value="Jalapa">Jalapa</option>
                            <option value="Jutiapa">Jutiapa</option>
                            <option value="Petén">Petén</option>
                            <option value="Quetzaltenango">Quetzaltenango</option>
                            <option value="Quiché">Quiché</option>
                            <option value="Retalhuleu">Retalhuleu</option>
                            <option value="Sacatépequez">Sacatépequez</option>
                            <option value="San Marcos">San Marcos</option>
                            <option value="Santa Rosa">Santa Rosa</option>
                            <option value="Sololá">Sololá</option>
                            <option value="Suchitepéquez">Suchitepéquez</option>
                            <option value="Totonicapán">Totonicapán</option>
                            <option value="Zacapa">Zacapa</option>
                        </select>
                    </div>

                    <!-- Municipio: ahora depende del Departamento y tiene buscador (Tom Select) -->
                    <div class="form-group">
                        <label class="form-label">Municipio</label>
                        <select th:field="*{municipio}" id="municipio" class="form-select">
                            <option value="">— Selecciona un departamento primero —</option>
                        </select>
                    </div>

                    <!-- Zona -->
                    <div class="form-group">
                        <label class="form-label">Zona</label>
                        <select th:field="*{zona}" class="form-select">
                            <option value="">Sin zona</option>
                            <option th:each="z : ${#numbers.sequence(1,25)}"
                                    th:value="${z}"
                                    th:text="'Zona ' + ${z}">
                            </option>
                        </select>
                    </div>
                </div>

                <!-- ── SECCIÓN: Datos Empresariales ─────────────── -->
                <div style="font-size:12px;font-weight:700;color:var(--turquesa);text-transform:uppercase;letter-spacing:1px;margin:20px 0 14px">
                    🏢 Datos Empresariales
                </div>

                <div class="form-row form-row-2">
                    <div class="form-group">
                        <label class="form-label">Nombre de la empresa</label>
                        <input type="text"
                            th:field="*{empresaNombre}"
                            class="form-control"
                            placeholder="Empresa donde trabaja el cliente">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Contacto / Encargado</label>
                        <input type="text"
                            th:field="*{empresaContacto}"
                            class="form-control"
                            placeholder="Jefe, RRHH o persona de contacto">
                    </div>
                </div>

                <div class="form-row form-row-2">
                    <div class="form-group">
                        <label class="form-label">Teléfono de la empresa</label>
                        <input type="text"
                            th:field="*{empresaTelefono}"
                            class="form-control"
                            placeholder="2222-0000">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Correo electrónico empresarial</label>
                        <input type="email"
                            th:field="*{empresaCorreo}"
                            class="form-control"
                            placeholder="empresa@correo.com">
                    </div>
                </div>

                <div class="form-row form-row-3">
                    <!-- Departamento -->
                    <div class="form-group">
                        <label class="form-label">Departamento</label>
                        <select th:field="*{empresaDepartamento}" class="form-select" onchange="cargarMunicipiosEmpresa()">
                            <option value="">— Seleccionar —</option>
                            <option value="Guatemala">Guatemala</option>
                            <option value="Alta Verapaz">Alta Verapaz</option>
                            <option value="Baja Verapaz">Baja Verapaz</option>
                            <option value="Chimaltenango">Chimaltenango</option>
                            <option value="Chiquimula">Chiquimula</option>
                            <option value="El Progreso">El Progreso</option>
                            <option value="Escuintla">Escuintla</option>
                            <option value="Huehuetenango">Huehuetenango</option>
                            <option value="Izabal">Izabal</option>
                            <option value="Jalapa">Jalapa</option>
                            <option value="Jutiapa">Jutiapa</option>
                            <option value="Petén">Petén</option>
                            <option value="Quetzaltenango">Quetzaltenango</option>
                            <option value="Quiché">Quiché</option>
                            <option value="Retalhuleu">Retalhuleu</option>
                            <option value="Sacatépequez">Sacatépequez</option>
                            <option value="San Marcos">San Marcos</option>
                            <option value="Santa Rosa">Santa Rosa</option>
                            <option value="Sololá">Sololá</option>
                            <option value="Suchitepéquez">Suchitepéquez</option>
                            <option value="Totonicapán">Totonicapán</option>
                            <option value="Zacapa">Zacapa</option>
                        </select>
                    </div>

                    <!-- Municipio: ahora depende del Departamento y tiene buscador (Tom Select) -->
                    <div class="form-group">
                        <label class="form-label">Municipio</label>
                        <select th:field="*{empresaMunicipio}" id="empresaMunicipio" class="form-select">
                            <option value="">— Selecciona un departamento primero —</option>
                        </select>
                    </div>

                    <!-- Zona -->
                    <div class="form-group">
                        <label class="form-label">Zona</label>
                        <select th:field="*{empresaZona}" class="form-select">
                            <option value="">Sin zona</option>
                            <option th:each="z : ${#numbers.sequence(1,25)}"
                                    th:value="${z}"
                                    th:text="'Zona ' + ${z}">
                            </option>
                        </select>
                    </div>
                </div>

                <!-- ── SECCIÓN: Notas ────────────────────────────── -->
                <div style="font-size:12px;font-weight:700;color:var(--turquesa);text-transform:uppercase;letter-spacing:1px;margin:20px 0 14px">
                     Notas
                </div>

                <div class="form-group">
                    <label class="form-label">Observaciones del cliente</label>
                    <textarea th:field="*{notas}"
                              class="form-control"
                              rows="2"
                              placeholder="Alergias, preferencias, observaciones especiales...">
                    </textarea>
                </div>

                <!-- Botones -->
                <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:24px;padding-top:20px;border-top:1px solid var(--gris-borde)">
                    <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary" style="min-width:160px">
                         <span th:text="${editando} ? 'Actualizar Cliente' : 'Registrar Cliente'"></span>
                    </button>
                </div>

            </form>
        </div>

    </div><!-- page-body -->
</div><!-- main-content -->

<script th:inline="javascript">
    // Valores actuales del cliente (para preseleccionar al editar)
    // ── Dirección personal ──
    const departamentoActual   = /*[[${cliente.departamento}]]*/ '';
    const municipioActual      = /*[[${cliente.municipio}]]*/ '';
    // ── Datos empresariales ──
    const departamentoEmpActual = /*[[${cliente.empresaDepartamento}]]*/ '';
    const municipioEmpActual    = /*[[${cliente.empresaMunicipio}]]*/ '';

    // ─── Dataset oficial: 22 departamentos y sus 340 municipios ─────────
    const MUNICIPIOS_POR_DEPARTAMENTO = {
        "Guatemala": ["Amatitlán","Chinautla","Chuarrancho","Guatemala","Fraijanes","Mixco","Palencia","San José del Golfo","San José Pinula","San Juan Sacatepéquez","San Miguel Petapa","San Pedro Ayampuc","San Pedro Sacatepéquez","San Raymundo","Santa Catarina Pinula","Villa Canales","Villa Nueva"],
        "Alta Verapaz": ["Chahal","Chisec","Cobán","Fray Bartolomé de las Casas","Santa Catalina La Tinta","Lanquín","Panzós","Raxruhá","San Cristóbal Verapaz","San Juan Chamelco","San Pedro Carchá","Santa Cruz Verapaz","Santa María Cahabón","Senahú","Tamahú","Tactic","Tucurú"],
        "Baja Verapaz": ["Cubulco","Granados","Purulhá","Rabinal","Salamá","San Jerónimo","San Miguel Chicaj","Santa Cruz el Chol"],
        "Chimaltenango": ["Acatenango","Chimaltenango","El Tejar","Parramos","Patzicía","Patzún","Pochuta","San Andrés Itzapa","San José Poaquíl","San Juan Comalapa","San Martín Jilotepeque","Santa Apolonia","Santa Cruz Balanyá","Tecpán Guatemala","Yepocapa","Zaragoza"],
        "Chiquimula": ["Camotán","Chiquimula","Concepción Las Minas","Esquipulas","Ipala","Jocotán","Olopa","Quetzaltepeque","San Jacinto","San José La Arada","San Juan Ermita"],
        "El Progreso": ["El Jícaro","Guastatoya","Morazán","San Agustín Acasaguastlán","San Antonio La Paz","San Cristóbal Acasaguastlán","Sanarate","Sansare"],
        "Escuintla": ["Escuintla","Guanagazapa","Iztapa","La Democracia","La Gomera","Masagua","Nueva Concepción","Palín","San José","San Vicente Pacaya","Santa Lucía Cotzumalguapa","Sipacate","Siquinalá","Tiquisate"],
        "Huehuetenango": ["Aguacatán","Chiantla","Colotenango","Concepción Huista","Cuilco","Huehuetenango","Jacaltenango","La Democracia","La Libertad","Malacatancito","Nentón","Petatán","San Antonio Huista","San Gaspar Ixchil","San Ildefonso Ixtahuacán","San Juan Atitán","San Juan Ixcoy","San Mateo Ixtatán","San Miguel Acatán","San Pedro Nécta","San Pedro Soloma","San Rafael La Independencia","San Rafael Pétzal","San Sebastián Coatán","San Sebastián Huehuetenango","Santa Ana Huista","Santa Bárbara","Santa Cruz Barillas","Santa Eulalia","Santiago Chimaltenango","Tectitán","Todos Santos Cuchumatán","Unión Cantinil"],
        "Izabal": ["El Estor","Livingston","Los Amates","Morales","Puerto Barrios"],
        "Jalapa": ["Jalapa","Mataquescuintla","Monjas","San Carlos Alzatate","San Luis Jilotepeque","San Manuel Chaparrón","San Pedro Pinula"],
        "Jutiapa": ["Agua Blanca","Asunción Mita","Atescatempa","Comapa","Conguaco","El Adelanto","El Progreso","Jalpatagua","Jerez","Jutiapa","Moyuta","Pasaco","Quesada","San José Acatempa","Santa Catarina Mita","Yupiltepeque","Zapotitlán"],
        "Petén": ["Dolores","El Chal","Flores","La Libertad","Las Cruces","Melchor de Mencos","Poptún","San Andrés","San Benito","San Francisco","San José","San Luis","Santa Ana","Sayaxché"],
        "Quetzaltenango": ["Almolonga","Cabricán","Cajolá","Cantel","Coatepeque","Colomba","Concepción Chiquirichapa","El Palmar","Flores Costa Cuca","Génova","Huitán","La Esperanza","Olintepeque","Palestina de Los Altos","Quetzaltenango","Salcajá","San Carlos Sija","San Francisco La Unión","San Juan Ostuncalco","San Martín Sacatepéquez","San Mateo","San Miguel Sigüilá","Sibilia","Zunil"],
        "Quiché": ["Canillá","Chajul","Chicamán","Chiché","Chichicastenango","Chinique","Cunén","Ixcán","Joyabaj","Nebaj","Pachalum","Patzité","Sacapulas","San Andrés Sajcabajá","San Antonio Ilotenango","San Bartolomé Jocotenango","San Juan Cotzal","San Pedro Jocopilas","Santa Cruz del Quiché","Uspantán","Zacualpa"],
        "Retalhuleu": ["Champerico","El Asintal","Nuevo San Carlos","Retalhuleu","San Andrés Villa Seca","San Felipe","San Martín Zapotitlán","San Sebastián","Santa Cruz Muluá"],
        "Sacatépequez": ["Alotenango","Ciudad Vieja","Jocotenango","La Antigua Guatemala","Magdalena Milpas Altas","Pastores","San Antonio Aguas Calientes","San Bartolomé Milpas Altas","San Lucas Sacatepéquez","San Miguel Dueñas","Santa Catarina Barahona","Santa Lucía Milpas Altas","Santa María de Jesús","Santiago Sacatepéquez","Santo Domingo Xenacoj","Sumpango"],
        "San Marcos": ["Ayutla","Catarina","Comitancillo","Concepción Tutuapa","El Quetzal","El Tumbador","Esquipulas Palo Gordo","Ixchiguán","La Blanca","La Reforma","Malacatán","Nuevo Progreso","Ocós","Pajapita","Río Blanco","San Antonio Sacatepéquez","San Cristóbal Cucho","San José El Rodeo","San José Ojetenam","San Lorenzo","San Marcos","San Miguel Ixtahuacán","San Pablo","San Pedro Sacatepéquez","San Rafael Pie de la Cuesta","Sibinal","Sipacapa","Tacaná","Tajumulco","Tejutla"],
        "Santa Rosa": ["Barberena","Casillas","Chiquimulilla","Cuilapa","Guazacapán","Nueva Santa Rosa","Oratorio","Pueblo Nuevo Viñas","San Juan Tecuaco","San Rafael Las Flores","Santa Cruz Naranjo","Santa María Ixhuatán","Santa Rosa de Lima","Taxisco"],
        "Sololá": ["Concepción","Nahualá","Panajachel","San Andrés Semetabaj","San Antonio Palopó","San José Chacayá","San Juan La Laguna","San Lucas Tolimán","San Marcos La Laguna","San Pablo La Laguna","San Pedro La Laguna","Santa Catarina Ixtahuacán","Santa Catarina Palopó","Santa Clara La Laguna","Santa Cruz La Laguna","Santa Lucía Utatlán","Santa María Visitación","Santiago Atitlán","Sololá"],
        "Suchitepéquez": ["Chicacao","Cuyotenango","Mazatenango","Patulul","Pueblo Nuevo","Río Bravo","Samayac","San Antonio Suchitepéquez","San Bernardino","San Francisco Zapotitlán","San Gabriel","San José El Ídolo","San José La Máquina","San Juan Bautista","San Lorenzo","San Miguel Panán","San Pablo Jocopilas","Santa Bárbara","Santo Domingo Suchitepéquez","Santo Tomás La Unión","Zunilito"],
        "Totonicapán": ["Momostenango","San Andrés Xecul","San Bartolo","San Cristóbal Totonicapán","San Francisco El Alto","Santa Lucía La Reforma","Santa María Chiquimula","Totonicapán"],
        "Zacapa": ["Cabañas","Estanzuela","Gualán","Huité","La Unión","Río Hondo","San Diego","San Jorge","Teculután","Usumatlán","Zacapa"]
    };

    let tsMunicipioDireccion = null;
    let tsMunicipioEmpresa   = null;

    // Función genérica: recibe el id del <select> de Departamento y la instancia
    // de Tom Select del Municipio correspondiente, y sincroniza las opciones.
    function cargarMunicipiosDependientes(deptoSelectId, tomSelectInstance, preseleccionar) {
        const depto = document.getElementById(deptoSelectId).value;
        const municipios = MUNICIPIOS_POR_DEPARTAMENTO[depto] || [];

        tomSelectInstance.clear(true);
        tomSelectInstance.clearOptions();

        if (municipios.length === 0) {
            tomSelectInstance.addOption({ value: '', text: '— Selecciona un departamento primero —' });
            tomSelectInstance.refreshOptions(false);
            return;
        }

        municipios.forEach(m => tomSelectInstance.addOption({ value: m, text: m }));
        tomSelectInstance.refreshOptions(false);

        if (preseleccionar && municipios.includes(preseleccionar)) {
            tomSelectInstance.setValue(preseleccionar, true);
        }
    }

    function cargarMunicipiosDireccion(preseleccionar) {
        cargarMunicipiosDependientes('departamento', tsMunicipioDireccion, preseleccionar);
    }

    function cargarMunicipiosEmpresa(preseleccionar) {
        cargarMunicipiosDependientes('empresaDepartamento', tsMunicipioEmpresa, preseleccionar);
    }

    document.addEventListener('DOMContentLoaded', () => {
        tsMunicipioDireccion = new TomSelect('#municipio', {
            create: false,
            placeholder: 'Busca un municipio...',
            sortField: { field: 'text', direction: 'asc' }
        });

        tsMunicipioEmpresa = new TomSelect('#empresaMunicipio', {
            create: false,
            placeholder: 'Busca un municipio...',
            sortField: { field: 'text', direction: 'asc' }
        });

        // Si estamos editando un cliente que ya tenía departamento/municipio, los precargamos
        if (departamentoActual) {
            cargarMunicipiosDireccion(municipioActual);
        }
        if (departamentoEmpActual) {
            cargarMunicipiosEmpresa(municipioEmpActual);
        }
    });

    // Si el usuario llena la fecha de nacimiento y el campo Edad está vacío,
    // se calcula automáticamente. El usuario puede sobreescribirla manualmente.
    function calcularEdad() {
        const fecha = document.getElementById('fechaNacimiento').value;
        const edadInput = document.getElementById('edad');
        if (!fecha) return;

        const hoy = new Date();
        const nacimiento = new Date(fecha);
        let edad = hoy.getFullYear() - nacimiento.getFullYear();
        const m = hoy.getMonth() - nacimiento.getMonth();
        if (m < 0 || (m === 0 && hoy.getDate() < nacimiento.getDate())) {
            edad--;
        }
        edadInput.value = edad;
    }
</script>

</body>
</html>
