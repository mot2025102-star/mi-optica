<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Óptica | Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,400&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent:      #00B4D8;
            --accent-glow: rgba(0, 180, 216, .18);
            --bg:          #F0F4F8;
            --card-bg:     #ffffff;
            --text:        #374151;
            --text-muted:  #6B7280;
            --border:      #D1D5DB;
            --border-focus:#00B4D8;
            --danger:      #DC2626;
            --success:     #059669;
            --warning:     #D97706;
            --navy-900:    #0D1B2A;
            --ease-out:    cubic-bezier(.16, 1, .3, 1);
            --font:        'Urbanist', system-ui, sans-serif;
        }

        html, body {
            height: 100%;
            font-family: var(--font);
            background-color: var(--bg);
            /* Fondo sutil con patrón de puntos */
            background-image: radial-gradient(circle, rgba(0,180,216,.08) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        /* ══ CENTRADO TOTAL ══ */
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
        }

        /* Brillo decorativo detrás de la card */
        .login-page::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 55% 45% at 30% 20%, rgba(0,180,216,.10), transparent 60%),
                radial-gradient(ellipse 45% 40% at 75% 80%, rgba(13,27,42,.07), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ══ CARD ══ */
        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 560px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow:
                0 2px 4px rgba(0,0,0,.04),
                0 8px 24px rgba(0,0,0,.08),
                0 0 0 1px rgba(0,180,216,.10);
            padding: 2rem 3.5rem 1.75rem;
            animation: cardUp .7s var(--ease-out) both;
        }

        /* ══ MARCA / OJO ══ */
        .login-brand {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .eye-container {
            width: 60px;
            height: 60px;
            margin: 0 auto 14px;
            cursor: none;
            position: relative;
        }

        .eye-svg { width: 60px; height: 60px; overflow: visible; }

        .eye-outline, .eye-iris {
            fill: none;
            stroke-width: 1.4;
            stroke: var(--accent);
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #eyePupil { fill: var(--accent); }
        #eyeLid   { fill: #ffffff; }

        .brand-name {
            font-size: 26px;
            font-weight: 400;
            color: var(--navy-900);
            letter-spacing: -.02em;
            line-height: 1.1;
        }
        .brand-name::after { content: "."; color: var(--accent); }

        .brand-sub {
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .28em;
            color: var(--accent);
            margin-top: 5px;
        }

        /* ══ ENCABEZADO FORMULARIO ══ */
        .login-heading {
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .login-heading h2 {
            font-size: 21px;
            font-weight: 400;
            color: var(--navy-900);
            letter-spacing: -.01em;
        }

        .login-heading p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        /* ══ ALERTAS ══ */
        .alert {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 13px;
            border: 1px solid transparent;
            margin-bottom: 1.5rem;
            animation: alertIn .4s var(--ease-out) both;
        }
        .alert-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }

        .alert-error   { color: var(--danger);  background: rgba(220,38,38,.07);  border-color: rgba(220,38,38,.2);  border-left: 3px solid var(--danger); }
        .alert--success { color: var(--success); background: rgba(5,150,105,.07);  border-color: rgba(5,150,105,.2);  border-left: 3px solid var(--success); }
        .alert--warning { color: var(--warning); background: rgba(217,119,6,.07);  border-color: rgba(217,119,6,.2);  border-left: 3px solid var(--warning); }

        /* ══ INPUTS ══ */
        .field-group {
            margin-bottom: 1.1rem;
        }

        .field-label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
            transition: color .2s;
        }

        .field-wrap {
            position: relative;
        }

        .field-input {
            width: 100%;
            padding: .75rem 1rem;
            padding-right: 2.75rem;
            background: #F9FAFB;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            font-family: var(--font);
            outline: none;
            caret-color: var(--accent);
            transition: border-color .2s, background .2s, box-shadow .2s;
        }

        .field-input:focus {
            border-color: var(--border-focus);
            background: #fff;
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* Autofill */
        .field-input:-webkit-autofill,
        .field-input:-webkit-autofill:hover,
        .field-input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--text) !important;
            -webkit-box-shadow: 0 0 0 1000px #F9FAFB inset !important;
        }

        /* Label sube cuando el campo tiene foco */
        .field-group:focus-within .field-label {
            color: var(--accent);
        }

        /* Icono dentro del input */
        .field-icon {
            position: absolute;
            right: .9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        .field-icon svg {
            width: 16px; height: 16px;
            stroke: currentColor; fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Toggle contraseña */
        .toggle-pass {
            position: absolute;
            right: .75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: .25rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            border-radius: 4px;
            transition: color .2s;
        }
        .toggle-pass:hover { color: var(--accent); }
        .toggle-pass svg {
            width: 16px; height: 16px;
            fill: none; stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ══ BOTÓN INGRESAR ══ */
        .login-btn {
            width: 100%;
            margin-top: 1.4rem;
            padding: 1rem;
            border-radius: 999px;
            background-color: var(--accent);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            font-family: var(--font);
            letter-spacing: .22em;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            box-shadow: 0 6px 20px -8px rgba(0,180,216,.5);
            transition: filter .2s, transform .1s, box-shadow .2s;
        }
        .login-btn:hover  {
            filter: brightness(1.1);
            box-shadow: 0 8px 28px -6px rgba(0,180,216,.55);
        }
        .login-btn:active { transform: scale(.98); }

        /* ══ FOOTER ══ */
        .login-footer {
            text-align: center;
            margin-top: 1.25rem;
        }

        .login-footer a {
            font-size: 11.5px;
            color: var(--text-muted);
            text-decoration: none;
            letter-spacing: .04em;
            transition: color .2s;
        }
        .login-footer a:hover { color: var(--accent); }

        /* ══ SEPARADOR DECORATIVO ══ */
        .divider {
            display: flex;
            align-items: center;
            gap: .75rem;
            margin: 1.25rem 0 0;
            color: var(--border);
            font-size: 10px;
            letter-spacing: .1em;
            color: var(--text-muted);
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ══ ANIMACIONES ══ */
        @keyframes cardUp  { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes alertIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

        /* ══ RESPONSIVE ══ */
        @media (max-width: 600px) {
            .login-card { padding: 1.75rem 1.5rem 1.5rem; border-radius: 16px; }
        }
    </style>
</head>
<body>

<div class="login-page">
    <div class="login-card">

        <!-- ── MARCA ── -->
        <div class="login-brand">
            <div class="eye-container" id="eyeContainer">
                <svg class="eye-svg" id="eyeSvg" viewBox="0 0 64 40" xmlns="http://www.w3.org/2000/svg">
                    <clipPath id="eyeClip">
                        <ellipse cx="32" cy="20" rx="30" ry="18"/>
                    </clipPath>
                    <path class="eye-outline" id="eyeOutline"
                          d="M2 20 C 10 4, 54 4, 62 20 C 54 36, 10 36, 2 20 Z"/>
                    <circle class="eye-iris" id="eyeIris" cx="32" cy="20" r="9"/>
                    <circle id="eyePupil" cx="32" cy="20" r="3.5"/>
                    <rect id="eyeLid" x="1" y="-40" width="62" height="40"
                          clip-path="url(#eyeClip)"/>
                </svg>
            </div>
            <div class="brand-name">Mi Óptica</div>
            <div class="brand-sub">mi mejor visión</div>
        </div>

        <!-- ── ENCABEZADO ── -->
        <div class="login-heading">
            <h2>Iniciar sesión</h2>
            <p>Ingresa tus credenciales para continuar</p>
        </div>

        <!-- ── ALERTAS ── -->
        <div th:if="${mensajeError}" class="alert alert-error">
            <span class="alert-icon">&#9888;</span>
            <span th:text="${mensajeError}"></span>
        </div>
        <div th:if="${mensajeLogout}" class="alert alert--success">
            <span class="alert-icon">&#10003;</span>
            <span th:text="${mensajeLogout}"></span>
        </div>
        <div th:if="${mensajeExpired}" class="alert alert--warning">
            <span class="alert-icon">&#9200;</span>
            <span th:text="${mensajeExpired}"></span>
        </div>

        <!-- ── FORMULARIO ── -->
        <form th:action="@{/login}" method="post" autocomplete="on" id="loginForm">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- Usuario -->
            <div class="field-group">
                <label for="username" class="field-label">Usuario</label>
                <div class="field-wrap">
                    <input type="text"
                           id="username" name="username"
                           class="field-input"
                           placeholder="Ingresa tu usuario"
                           required autofocus autocomplete="username">
                    <span class="field-icon">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                    </span>
                </div>
            </div>

            <!-- Contraseña -->
            <div class="field-group">
                <label for="password" class="field-label">Contraseña</label>
                <div class="field-wrap">
                    <input type="password"
                           id="password" name="password"
                           class="field-input"
                           placeholder="••••••••"
                           required autocomplete="current-password">
                    <button type="button" class="toggle-pass" id="togglePass"
                            tabindex="-1" aria-label="Mostrar contraseña">
                        <svg id="iconoOjo" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Botón -->
            <button type="submit" class="login-btn">Ingresar</button>
        </form>

        <!-- ── FOOTER ── -->
        <div class="divider">Sistema interno</div>
        <div class="login-footer">
            <a href="#" onclick="alert('Contacta al administrador del sistema.'); return false;">
                ¿Olvidaste tu contraseña?
            </a>
        </div>

    </div>
</div>

<script>
/* ── TOGGLE CONTRASEÑA ── */
const passInput = document.getElementById('password');
const iconoOjo  = document.getElementById('iconoOjo');
const SVG_OPEN   = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
const SVG_CLOSED = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';

document.getElementById('togglePass').addEventListener('click', function () {
    if (passInput.type === 'password') {
        passInput.type = 'text';
        iconoOjo.innerHTML = SVG_CLOSED;
        this.setAttribute('aria-label', 'Ocultar contraseña');
    } else {
        passInput.type = 'password';
        iconoOjo.innerHTML = SVG_OPEN;
        this.setAttribute('aria-label', 'Mostrar contraseña');
    }
});

/* ── OJO QUE SIGUE EL MOUSE ── */
const eyeContainer = document.getElementById('eyeContainer');
const eyePupil     = document.getElementById('eyePupil');
const eyeIris      = document.getElementById('eyeIris');
const EYE_CX = 32, EYE_CY = 20, MAX_MOVE = 5;

document.addEventListener('mousemove', function (e) {
    const rect    = eyeContainer.getBoundingClientRect();
    const centerX = rect.left + rect.width  / 2;
    const centerY = rect.top  + rect.height / 2;
    const dx = e.clientX - centerX;
    const dy = e.clientY - centerY;
    const dist    = Math.sqrt(dx * dx + dy * dy);
    const maxDist = Math.max(window.innerWidth, window.innerHeight) * 0.4;
    const factor  = Math.min(dist / maxDist, 1);
    const angle   = Math.atan2(dy, dx);
    const mx = Math.cos(angle) * MAX_MOVE * factor;
    const my = Math.sin(angle) * MAX_MOVE * factor;

    eyePupil.setAttribute('cx', EYE_CX + mx);
    eyePupil.setAttribute('cy', EYE_CY + my);
    eyeIris.setAttribute('cx',  EYE_CX + mx * 0.5);
    eyeIris.setAttribute('cy',  EYE_CY + my * 0.5);
});

/* ── PARPADEO ALEATORIO ── */
const eyeLid = document.getElementById('eyeLid');

function blink() {
    let pos = -40;
    const down = setInterval(() => {
        pos += 4;
        eyeLid.setAttribute('y', pos);
        if (pos >= 2) {
            clearInterval(down);
            setTimeout(() => {
                const up = setInterval(() => {
                    pos -= 4;
                    eyeLid.setAttribute('y', pos);
                    if (pos <= -40) {
                        clearInterval(up);
                        eyeLid.setAttribute('y', -40);
                    }
                }, 12);
            }, 80);
        }
    }, 12);
    setTimeout(blink, 2500 + Math.random() * 3500);
}
setTimeout(blink, 1500 + Math.random() * 2000);
</script>

</body>
</html>
