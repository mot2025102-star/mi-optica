<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Óptica | Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent:      #00B4D8;
            --accent-dim:  rgba(0,180,216,.14);
            --accent-glow: rgba(0,180,216,.22);
            --bg:          #EEF4F8;
            --card-bg:     #ffffff;
            --text:        #1E293B;
            --text-muted:  #64748B;
            --border:      #CBD5E1;
            --border-focus:#00B4D8;
            --danger:      #DC2626;
            --success:     #059669;
            --warning:     #D97706;
            --navy:        #0D1B2A;
            --teal:        #00b5b8;
            --yellow:      #f5d800;
            --dark:        #0a0a0a;
            --intro-bg:    var(--bg);
            --ease-spring: cubic-bezier(.16,1,.3,1);
            --font:        'Urbanist', system-ui, sans-serif;
        }

        html, body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg);
            background-image:
                radial-gradient(circle at 25% 15%, rgba(0,180,216,.07) 0%, transparent 55%),
                radial-gradient(circle at 80% 85%, rgba(13,27,42,.06) 0%, transparent 50%),
                radial-gradient(circle, rgba(0,180,216,.05) 1px, transparent 1px);
            background-size: auto, auto, 28px 28px;
        }

        /* ══════════════════════════════
           FASE 1 — REVEAL
        ══════════════════════════════ */
        .reveal-scene { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
        .reveal-black {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            clip-path: inset(0% 0% 0% 0%);
            animation: revealWipe 1.8s 0.3s cubic-bezier(0.76, 0, 0.24, 1) forwards;
        }
        @keyframes revealWipe {
            0%   { clip-path: inset(0% 0%   0% 0%); }
            100% { clip-path: inset(0% 100% 0% 0%); }
        }
        .reveal-img { width: 480px; height: auto; object-fit: contain; }
        .reveal-beam {
            position: absolute; top: 0; left: -18%; width: 18%; height: 100%;
            background: linear-gradient(to right, transparent 0%, rgba(255,255,255,0.04) 20%, rgba(255,255,255,0.28) 50%, rgba(255,255,255,0.04) 80%, transparent 100%);
            opacity: 0; animation: beamMove 1.8s 0.3s cubic-bezier(0.76, 0, 0.24, 1) forwards;
        }
        @keyframes beamMove {
            0%   { left: -18%; opacity: 0; }
            4%   { opacity: 1; }
            96%  { opacity: 1; }
            100% { left: 118%; opacity: 0; }
        }

        /* ══════════════════════════════
           FASE 2 — LOGO ANIMADO
        ══════════════════════════════ */
        .logo-wrap {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            opacity: 0; animation: logoFadeIn 0.6s 1.8s ease forwards;
        }
        @keyframes logoFadeIn { from { opacity: 0; } to { opacity: 1; } }
        .logo-row { display: flex; align-items: center; line-height: 1; gap: 0; }
        .text-mi { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 96px; color: var(--teal); letter-spacing: -1px; margin-left: 15px; }
        .text-ptica { font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 96px; color: var(--yellow); letter-spacing: 0px; margin-left: -16px; }
        .text-tica { font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 96px; color: var(--teal); letter-spacing: 0px; margin-left: 0.5px; }
        .tagline { font-family: 'Nunito Sans', sans-serif; font-weight: 600; font-size: 22px; color: var(--teal); letter-spacing: 1.5px; text-align: right; align-self: flex-end; padding-right: 10px; margin-top: -20px; }

        .eye-container { width: 124px; height: 100px; position: relative; display: inline-flex; align-items: center; justify-content: center; margin: 0 -1px; }
        .eye-svg { width: 100%; height: 100%; overflow: visible; }
        .eye-ring { fill: none; stroke: var(--yellow); stroke-width: 7; stroke-linejoin: round; filter: drop-shadow(0 0 6px rgba(245,216,0,0.55)); animation: ringGlow 4s 2.5s ease-in-out infinite; }
        @keyframes ringGlow { 0%,38%,58%,100% { filter: drop-shadow(0 0 6px rgba(245,216,0,0.55)); } 45%,52% { filter: drop-shadow(0 0 0px rgba(245,216,0,0)); } }
        .eye-fill { fill: #030f10; }
        .pupil-curve { fill: none; stroke: var(--teal); stroke-width: 6.5; stroke-linecap: round; }
        .accent-mark, .accent-mark4 { fill: none; stroke-linecap: round; }
        .accent-mark { stroke: var(--teal); stroke-width: 11; }
        .accent-mark4 { stroke: var(--intro-bg); stroke-width: 15; }
        .accent-mark2, .accent-mark5, .accent-mark6 { fill: none; stroke: var(--yellow); stroke-width: 9; stroke-linecap: round; }
        .accent-mark3 { fill: none; stroke: var(--intro-bg); stroke-width: 12; stroke-linecap: round; }
        .t-rect { fill: var(--intro-bg); }
        .lid-top { fill: var(--yellow); animation: blinkTop 4s 2.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
        .lid-bot { fill: var(--yellow); animation: blinkBot 4s 2.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center top; }
        @keyframes blinkTop { 0%,38%,58%,100% { transform: scaleY(0); } 45%,52% { transform: scaleY(1); } }
        @keyframes blinkBot { 0%,38%,58%,100% { transform: scaleY(0); } 45%,52% { transform: scaleY(1); } }

        /* ══ LAYOUT ══ */
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        /* ══ CARD ══ */
        .login-card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow:
                0 1px 2px rgba(0,0,0,.04),
                0 4px 16px rgba(0,0,0,.06),
                0 20px 48px rgba(0,0,0,.08),
                0 0 0 1px rgba(0,180,216,.12);
            padding: 2.5rem 3rem 2rem;
            animation: cardUp .7s var(--ease-spring) both;
        }

        /* ══ BRAND + EYE ══ */
        .login-brand {
            text-align: center;
            margin-bottom: 2rem;
            user-select: none;
        }

        /* ─ EYE WRAPPER ─ */
        .eye-wrap {
            width: 72px;
            height: 44px;
            margin: 0 auto 16px;
            position: relative;
            cursor: none;
        }

        .eye-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0 0 8px rgba(0,180,216,.35));
        }

        /* Esclerótica */
        .e-sclera {
            fill: #fff;
            stroke: var(--accent);
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        /* Iris externo */
        .e-iris-outer {
            fill: none;
            stroke: var(--accent);
            stroke-width: 1.4;
            opacity: .6;
        }
        /* Iris relleno degradado */
        .e-iris-fill { fill: url(#irisGrad); }

        /* Pupila */
        .e-pupil {
            fill: var(--navy);
            transition: r .15s ease;
        }
        /* Reflejo */
        .e-glint {
            fill: rgba(255,255,255,.75);
            pointer-events: none;
        }
        /* Venas decorativas muy sutiles */
        .e-vein {
            stroke: rgba(220,80,80,.18);
            stroke-width: .6;
            fill: none;
            stroke-linecap: round;
        }
        /* Pestañas */
        .e-lash {
            stroke: var(--navy);
            stroke-width: 1.2;
            stroke-linecap: round;
            fill: none;
        }
        /* Párpado (para el parpadeo) */
        .e-lid {
            fill: var(--card-bg);
            pointer-events: none;
        }

        /* ─ NOMBRE ─ */
        .brand-name {
            font-size: 28px;
            font-weight: 400;
            color: var(--navy);
            letter-spacing: -.025em;
            line-height: 1.1;
        }
        .brand-name::after { content: "."; color: var(--accent); }

        .brand-sub {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .3em;
            color: var(--accent);
            margin-top: 5px;
        }

        /* ══ HEADING ══ */
        .login-heading {
            margin-bottom: 1.6rem;
            padding-bottom: 1.1rem;
            border-bottom: 1px solid var(--border);
        }
        .login-heading h2 {
            font-size: 22px;
            font-weight: 400;
            color: var(--navy);
            letter-spacing: -.01em;
        }
        .login-heading p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        /* ══ ALERTAS ══ */
        .alert {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 11px 14px;
            border-radius: 12px;
            font-size: 13px;
            border: 1px solid transparent;
            margin-bottom: 1.4rem;
            animation: alertIn .4s var(--ease-spring) both;
        }
        .alert-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
        .alert-error   { color: var(--danger);  background: rgba(220,38,38,.07);  border-color: rgba(220,38,38,.2);  border-left: 3px solid var(--danger); }
        .alert--success { color: var(--success); background: rgba(5,150,105,.07);  border-color: rgba(5,150,105,.2);  border-left: 3px solid var(--success); }
        .alert--warning { color: var(--warning); background: rgba(217,119,6,.07);  border-color: rgba(217,119,6,.2);  border-left: 3px solid var(--warning); }

        /* ══ FLOATING LABEL FIELDS ══ */
        .field-group {
            position: relative;
            margin-bottom: 1.3rem;
        }

        /* Label flotante */
        .field-label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            pointer-events: none;
            transition:
                top        .22s var(--ease-spring),
                transform  .22s var(--ease-spring),
                font-size  .22s var(--ease-spring),
                color      .18s ease,
                left       .22s var(--ease-spring);
            z-index: 2;
            background: transparent;
            padding: 0 4px;
            letter-spacing: .01em;
        }

        /* Estado flotado: cuando tiene foco o contenido */
        .field-input:focus  ~ .field-label,
        .field-input:not(:placeholder-shown) ~ .field-label {
            top: 0px;
            transform: translateY(-50%);
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--card-bg);
            left: 12px;
        }

        /* Input base */
        .field-input {
            width: 100%;
            padding: 18px 48px 6px 16px;
            background: #F8FAFC;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 15px;
            font-family: var(--font);
            font-weight: 500;
            outline: none;
            caret-color: var(--accent);
            transition: border-color .2s, background .2s, box-shadow .2s;
            position: relative;
            z-index: 1;
        }
        /* Ocultar placeholder real — lo simula el label flotante */
        .field-input::placeholder { color: transparent; }

        .field-input:hover  { border-color: #94A3B8; background: #F1F5F9; }
        .field-input:focus  {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* Autofill: evitar fondo azul del navegador */
        .field-input:-webkit-autofill,
        .field-input:-webkit-autofill:hover,
        .field-input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--text) !important;
            -webkit-box-shadow: 0 0 0 1000px #F8FAFC inset !important;
        }

        /* ─ Puntos de contraseña MÁS GRANDES ─ */
        input[type="password"].field-input {
            font-size: 28px;
        letter-spacing: 6px;
            padding-top: 14px;
            padding-bottom: 2px;
        }

        /* Icono / toggle derecha */
        .field-icon-btn,
        .field-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 3;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            pointer-events: none;
        }
        .field-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            pointer-events: all;
            padding: 6px;
            border-radius: 8px;
            transition: color .18s, background .18s;
        }
        .field-icon-btn:hover { color: var(--accent); background: var(--accent-dim); }
        .field-icon-btn svg,
        .field-icon svg {
            width: 17px; height: 17px;
            fill: none; stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round; stroke-linejoin: round;
            display: block;
        }

        /* ══ BOTÓN INGRESAR ══ */
        .login-btn {
            width: 100%;
            margin-top: 1.5rem;
            padding: 15px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            font-family: var(--font);
            letter-spacing: .24em;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            box-shadow:
                0 4px 14px -2px rgba(0,180,216,.45),
                inset 0 1px 0 rgba(255,255,255,.18);
            transition: filter .18s, transform .1s, box-shadow .2s;
            position: relative;
            overflow: hidden;
        }
        .login-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,.14) 0%, transparent 60%);
            pointer-events: none;
        }
        .login-btn:hover  {
            filter: brightness(1.08);
            box-shadow: 0 8px 28px -4px rgba(0,180,216,.55), inset 0 1px 0 rgba(255,255,255,.18);
            transform: translateY(-1px);
        }
        .login-btn:active { transform: scale(.98) translateY(0); }

        /* ══ FOOTER ══ */
        .divider {
            display: flex; align-items: center; gap: .75rem;
            margin: 1.4rem 0 0;
            font-size: 10px; letter-spacing: .1em; color: var(--text-muted);
        }
        .divider::before, .divider::after {
            content: ""; flex: 1; height: 1px; background: var(--border);
        }
        .login-footer { text-align: center; margin-top: .9rem; }
        .login-footer a {
            font-size: 12px; color: var(--text-muted);
            text-decoration: none; letter-spacing: .03em;
            transition: color .18s;
        }
        .login-footer a:hover { color: var(--accent); }

        /* ══ ANIMACIONES ══ */
        @keyframes cardUp  { from { opacity:0; transform:translateY(28px) scale(.97); } to { opacity:1; transform:translateY(0) scale(1); } }
        @keyframes alertIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }

        /* ══ RESPONSIVE ══ */
        @media (max-width:520px) {
            .login-card { padding: 2rem 1.5rem 1.75rem; border-radius: 18px; }
        }
    </style>
</head>
<body>

<div class="login-page">
    <div class="login-card">

            <!-- ══ FASE 1: REVEAL ══ -->
            <div class="reveal-scene" style="bottom: auto; height: 150px; border-radius: 24px 24px 0 0;">
              <div class="reveal-beam"></div>
            </div>

            <div class="logo-wrap" style="transform: scale(0.65); transform-origin: center; margin-bottom: -30px;">
              <div class="logo-row">

                <span class="text-mi">Mi</span>
                <div class="divider-rect"></div>

                <div class="eye-container">
                  <svg class="eye-svg" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">

                    <ellipse cx="62" cy="54" rx="40" ry="34" fill="transparent"/>

                    <ellipse class="eye-ring" cx="62" cy="54" rx="40" ry="34"/>

                    <path class="pupil-curve" d="M53 55 Q62 48 71 55"/>

                    <clipPath id="topHalf">
                      <rect x="18" y="18" width="90" height="36"/>
                    </clipPath>
                    <ellipse class="lid-top" cx="62" cy="54" rx="40" ry="34" clip-path="url(#topHalf)"/>

                    <clipPath id="botHalf">
                      <rect x="18" y="54" width="90" height="36"/>
                    </clipPath>
                    <ellipse class="lid-bot" cx="62" cy="54" rx="40" ry="34" clip-path="url(#botHalf)"/>

                    <path class="accent-mark4" d="M60 16 Q61 14 70 8"/>
                    <path class="accent-mark" d="M60 16 Q61 14 70 8"/>
                    <path class="accent-mark3" d="M90 59 Q110 52 130 59"/>
                    <path class="accent-mark2" d="M90 59 Q110 52 130 59"/>
                    <rect class="t-rect" x="163" y="32" width="9" height="14" rx="3"/>
                    <path class="accent-mark5" d="M24 40 Q0 40 15 40"/>
                    <path class="accent-mark6" d="M150 40 Q170 40 156 40"/>

                  </svg>
                </div>

                <span class="text-ptica">p</span><span class="text-tica">tica</span>
              </div>

              <div class="tagline">mi mejor visión</div>
            </div>

        <!-- ── HEADING ── -->
        <div class="login-heading">
            <h2>Iniciar sesión</h2>
            <p>Ingresa tus credenciales para continuar</p>
        </div>

        <!-- ── ALERTAS ── -->
        <div th:if="${mensajeError}" class="alert alert-error">
            <span class="alert-icon">&#9888;</span>
            <span th:text="${mensajeError}"></span>
        </div>
        <div th:if="${mensajeLogout}" class="alert alert--success">
            <span class="alert-icon">&#10003;</span>
            <span th:text="${mensajeLogout}"></span>
        </div>
        <div th:if="${mensajeExpired}" class="alert alert--warning">
            <span class="alert-icon">&#9200;</span>
            <span th:text="${mensajeExpired}"></span>
        </div>

        <!-- ── FORMULARIO ── -->
        <form th:action="@{/login}" method="post" autocomplete="on">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- ─ USUARIO (floating label) ─ -->
            <div class="field-group">
                <input type="text"
                       id="username" name="username"
                       class="field-input"
                       placeholder=" "
                       required autofocus autocomplete="username">
                <label for="username" class="field-label">Usuario</label>
                <span class="field-icon">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                </span>
            </div>

            <!-- ─ CONTRASEÑA (floating label + toggle) ─ -->
            <div class="field-group">
                <input type="password"
                       id="password" name="password"
                       class="field-input"
                       placeholder=" "
                       required autocomplete="current-password">
                <label for="password" class="field-label">Contraseña</label>
                <button type="button" class="field-icon-btn" id="togglePass"
                        tabindex="-1" aria-label="Mostrar contraseña">
                    <svg id="iconoOjo" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <button type="submit" class="login-btn">Ingresar</button>
        </form>

        <!-- ── FOOTER ── -->
        <div class="divider">Sistema interno</div>
        <div class="login-footer">
            <a href="#" onclick="alert('Contacta al administrador del sistema.'); return false;">
                ¿Olvidaste tu contraseña?
            </a>
        </div>

    </div>
</div>

<script>
  // ── Paréntesis sigue el cursor ──────────────────────────────────
  const curve        = document.querySelector('.pupil-curve');
  const eyeContainer = document.querySelector('.eye-container');

  const MAX_X = 11;  // px máximo horizontal
  const MAX_Y =  8;  // px máximo vertical

  const smooth = v => v / Math.sqrt(1 + v * v);

  let curX = 0, curY = 0;
  let tgtX = 0, tgtY = 0;

  document.addEventListener('mousemove', (e) => {
    if (!eyeContainer) return;
    const rect = eyeContainer.getBoundingClientRect();
    const cx   = rect.left + rect.width  / 2;
    const cy   = rect.top  + rect.height / 2;
    const dx = (e.clientX - cx) / (window.innerWidth  / 2);
    const dy = (e.clientY - cy) / (window.innerHeight / 2);

    tgtX = smooth(dx) * MAX_X;
    tgtY = smooth(dy) * MAX_Y;
  });

  document.addEventListener('mouseleave', () => {
    tgtX = 0;
    tgtY = 0;
  });

  function lerp(a, b, t) { return a + (b - a) * t; }

  function tick() {
    if (!curve) return;
    curX = lerp(curX, tgtX, 0.09);
    curY = lerp(curY, tgtY, 0.09);
    curve.setAttribute('transform',
      `translate(${curX.toFixed(3)}, ${curY.toFixed(3)})`);
    requestAnimationFrame(tick);
  }

  setTimeout(tick, 2200);

/* ══════════════════════════════════════════════
   TOGGLE CONTRASEÑA
   ══════════════════════════════════════════════ */
   (function () {
    const passInput = document.getElementById('password');
    const iconoOjo  = document.getElementById('iconoOjo');
    const btn       = document.getElementById('togglePass');

    const SVG_OPEN   = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    const SVG_CLOSED = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';

    btn.addEventListener('click', function () {
        const show = passInput.type === 'password';
        passInput.type     = show ? 'text'     : 'password';
        iconoOjo.innerHTML = show ? SVG_CLOSED : SVG_OPEN;
        btn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });
})();
</script>

</body>
</html>
