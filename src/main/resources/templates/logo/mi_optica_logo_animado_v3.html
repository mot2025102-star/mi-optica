<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Óptica – Logo Animado</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Nunito+Sans:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --teal:     #00b5b8;
    --yellow:   #f5d800;
    --dark:     #0a0a0a;
    --intro-bg: #c4eef5; /* celeste claro — fase 1 */
  }

  body {
    background: var(--intro-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
  }

  /* ══════════════════════════════
     FASE 1 — REVEAL
     El logo negro cubre la pantalla,
     un haz de luz lo barre L→R
     revelando el logo a color debajo.
     Una vez completo, la animación
     del logo toma el control.
  ══════════════════════════════ */
  .reveal-scene {
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: none;
  }

  /* logo negro — capa superior que se barre */
  .reveal-black {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    clip-path: inset(0% 0% 0% 0%);
    animation: revealWipe 1.8s 0.3s cubic-bezier(0.76, 0, 0.24, 1) forwards;
  }

  @keyframes revealWipe {
    0%   { clip-path: inset(0% 0%   0% 0%); }
    100% { clip-path: inset(0% 100% 0% 0%); }
  }

  .reveal-img {
    width: 480px;
    height: auto;
    object-fit: contain;
  }

  /* haz de luz */
  .reveal-beam {
    position: absolute;
    top: 0; left: -18%; width: 18%; height: 100%;
    background: linear-gradient(to right,
      transparent 0%,
      rgba(255,255,255,0.04) 20%,
      rgba(255,255,255,0.28) 50%,
      rgba(255,255,255,0.04) 80%,
      transparent 100%);
    opacity: 0;
    animation: beamMove 1.8s 0.3s cubic-bezier(0.76, 0, 0.24, 1) forwards;
  }

  @keyframes beamMove {
    0%   { left: -18%; opacity: 0; }
    4%   { opacity: 1; }
    96%  { opacity: 1; }
    100% { left: 118%; opacity: 0; }
  }

  /* ══════════════════════════════
     FASE 2 — LOGO ANIMADO
     El logo SVG construido sobre el
     código original. Fade-in suave
     después del reveal.
  ══════════════════════════════ */
  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    opacity: 0;
    /* aparece justo cuando el reveal termina */
    animation: logoFadeIn 0.6s 1.8s ease forwards;
  }

  @keyframes logoFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ── main text row ── */
  .logo-row {
    display: flex;
    align-items: center;
    line-height: 1;
    gap: 0;
  }
  .text-mi {
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
  font-size: 96px;
  color: var(--teal);
  letter-spacing: -1px;
  margin-left: 15;
  }
  .text-ptica {
    font-family: 'Nunito', sans-serif;
    font-weight: 600;
    font-size: 96px;
    color: var(--yellow);
    letter-spacing: 0px;
    margin-left: -16px;
  }
  .text-tica {
    font-family: 'Nunito', sans-serif;
    font-weight: 600;
    font-size: 96px;
    color: var(--teal);
    letter-spacing: 0px;
    margin-left: 0.5px;
  }

  /* ── tagline ── */
  .tagline {
  font-family: 'Nunito Sans', sans-serif;
  font-weight: 600;
  font-size: 22px;
  color: var(--teal);
  letter-spacing: 1.5px;
  text-align: right;
  align-self: flex-end;
  padding-right: 10px;
  margin-top: -20px;
}

  /* ══════════════════════════════
     LA "Ó" — SVG DEL OJO
     Forma fiel al logo original:
     - Anillo amarillo irregular (lente de gafas)
     - Interior oscuro
     - Curvita teal como pupila (línea roja del logo)
     - Párpados superior e inferior (amarillo)
     - Tilde del acento arriba
  ══════════════════════════════ */
  .eye-container {
    width: 124px;
    height: 100px;
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin: 0 -1px;
  }

  .eye-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* anillo exterior amarillo — forma de lente */
  .eye-ring {
    fill: none;
    stroke: var(--yellow);
    stroke-width: 7;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px rgba(245,216,0,0.55));
    animation: ringGlow 4s 2.5s ease-in-out infinite;
  }

  @keyframes ringGlow {
    0%,38%,58%,100% { filter: drop-shadow(0 0 6px rgba(245,216,0,0.55)); }
    45%,52%          { filter: drop-shadow(0 0 0px rgba(245,216,0,0));    }
  }

  /* fondo oscuro del interior */
  .eye-fill {
    fill: #030f10;
  }
  

  /* ── CURVITA TEAL — la pupila ──
     El movimiento lo controla JS (sigue el cursor).
     El parpadeo sigue siendo CSS.
  ── */
  .pupil-curve {
    fill: none;
    stroke: var(--teal);
    stroke-width: 6.5;
    stroke-linecap: round;
    /* transform-box: fill-box ELIMINADO — fill-box de path con fill:none
       es 0×0 en todos los navegadores → comportamiento indefinido          */
    /* transition ELIMINADO — el lerp de JS ya suaviza el movimiento.
       Tener ambos crea conflicto frame-a-frame (CSS re-triggerea c/ rAF)   */
  }
    /* tilde del acento (´) — color teal como las letras "Mi" */
  .accent-mark {
    fill: none;
    stroke: var(--teal);
    stroke-width: 11;
    stroke-linecap: round;
  }
  .accent-mark2 {
    fill: none;
    stroke: var(--yellow);
    stroke-width: 9;
    stroke-linecap: round;
  }
  .accent-mark3 {
    fill: none;
    stroke: var(--intro-bg); /* máscara — debe coincidir con el fondo */
    stroke-width: 12;
    stroke-linecap: round;
  }
  .accent-mark4 {
    fill: none;
    stroke: var(--intro-bg); /* máscara — debe coincidir con el fondo */
    stroke-width: 15;
    stroke-linecap: round;
  }
  .accent-mark5 {
    fill: none;
    stroke: var(--yellow);
    stroke-width: 9;
    stroke-linecap: round;
  }
  .accent-mark6 {
    fill: none;
    stroke: var(--yellow);
    stroke-width: 9;
    stroke-linecap: round;
  }
  .t-rect {
    fill: var(--intro-bg); /* máscara — debe coincidir con el fondo */
  }



  @keyframes lookAround {
    /* fija → derecha-arriba → fija → centro (antes parpadeo) → 
       parpadeo → izq-abajo → fija → regresa */
    0%,  15% { transform: translate(0px,   0px);  }
    25%      { transform: translate(5px,  -3px);  }
    35%      { transform: translate(5px,  -3px);  }
    43%      { transform: translate(0px,   0px);  } /* centro antes parpadeo */
    58%      { transform: translate(0px,   0px);  } /* ojo cerrado */
    68%      { transform: translate(-4px,  2px);  }
    78%      { transform: translate(-4px,  2px);  }
    90%      { transform: translate(0px,   0px);  }
    100%     { transform: translate(0px,   0px);  }
  }

  /* párpado superior */
  .lid-top {
    fill: var(--yellow);
    animation: blinkTop 4s 2.5s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center bottom;
  }

  /* párpado inferior */
  .lid-bot {
    fill: var(--yellow);
    animation: blinkBot 4s 2.5s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center top;
  }

  @keyframes blinkTop {
    0%,38%,58%,100% { transform: scaleY(0); }
    45%,52%          { transform: scaleY(1); }
  }
  @keyframes blinkBot {
    0%,38%,58%,100% { transform: scaleY(0); }
    45%,52%          { transform: scaleY(1); }
  }

<!-- ══ FASE 2: LOGO ANIMADO ══ -->
<div class="logo-wrap">
  <div class="logo-row">

    <span class="text-mi">Mi</span>
    <div class="divider-rect"></div>

    <!-- La "Ó" recreada fielmente como SVG animado -->
    <div class="eye-container">
      <!--
        viewBox calibrado sobre la O del logo real:
        Lente amarilla: forma irregular asimétrica
        Interior oscuro: #030f10
        Curvita teal: la "pupila" que se mueve
        Párpados: amarillo, clippeados por mitad
        Tilde: trazo amarillo arriba
      -->
      <svg class="eye-svg" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">

        <!-- Interior oscuro de la O (relleno) -->
        <ellipse class="eye-fill" cx="62" cy="54" rx="40" ry="34"/>

        <!-- Anillo exterior — forma de lente/gafas amarilla -->
        <ellipse class="eye-ring" cx="62" cy="54" rx="40" ry="34"/>

        <!-- ── CURVITA TEAL (la pupila) ──
             Forma de paréntesis curvo, pequeña,
             centrada dentro de la O.
        ── -->
        <path class="pupil-curve"
              d="M53 55 Q62 48 71 55"/>

        <!-- Párpado SUPERIOR — clip a mitad superior -->
        <clipPath id="topHalf">
          <rect x="18" y="18" width="90" height="36"/>
        </clipPath>
        <ellipse class="lid-top" cx="62" cy="54" rx="40" ry="34"
                 clip-path="url(#topHalf)"/>

        <!-- Párpado INFERIOR — clip a mitad inferior -->
        <clipPath id="botHalf">
          <rect x="18" y="54" width="90" height="36"/>
        </clipPath>
        <ellipse class="lid-bot" cx="62" cy="54" rx="40" ry="34"
                 clip-path="url(#botHalf)"/>
        <!-- Tilde del acento (´) encima de la O -->
        <path class="accent-mark4" d="M60 16 Q61 14 70 8"/>
        <path class="accent-mark" d="M60 16 Q61 14 70 8"/>
        <path class="accent-mark3" d="M90 59 Q110 52 130 59"/>
        <path class="accent-mark2" d="M90 59 Q110 52 130 59"/>
        <rect class="t-rect" x="163" y="32" width="9" height="14" rx="3"/>
        <path class="accent-mark5" d="M24 40 Q0 40 15 40"/>
        <path class="accent-mark6" d="M150 40 Q170 40 156 40"/>

      </svg>
    </div>

    <span class="text-ptica">p</span><span class="text-tica">tica</span>
  </div>

  <div class="tagline">mi mejor visión</div>
</div>

<script>
  // ── Paréntesis sigue el cursor ──────────────────────────────────
  // FIXES aplicados:
  //   1. transform-box: fill-box eliminado del CSS (fill-box de fill:none es 0x0)
  //   2. transition CSS eliminado (peleaba con rAF → causaba el "regreso" brusco)
  //   3. Reemplazado Math.clamp duro por sigmoide suave → sin tope de pared

  const curve        = document.querySelector('.pupil-curve');
  const eyeContainer = document.querySelector('.eye-container');

  const MAX_X = 11;  // px máximo horizontal
  const MAX_Y =  8;  // px máximo vertical

  // Sigmoide suave: v / √(1 + v²)
  // A diferencia del clamp duro, se acerca a ±1 de forma asintótica.
  // El ojo SIEMPRE sigue al cursor — sin "pared" ni snap-back.
  const smooth = v => v / Math.sqrt(1 + v * v);

  let curX = 0, curY = 0;
  let tgtX = 0, tgtY = 0;

  document.addEventListener('mousemove', (e) => {
    const rect = eyeContainer.getBoundingClientRect();
    const cx   = rect.left + rect.width  / 2;
    const cy   = rect.top  + rect.height / 2;

    // Normalizar respecto a la mitad del viewport
    // (el ojo recorre todo su rango cuando el cursor está a medio viewport)
    const dx = (e.clientX - cx) / (window.innerWidth  / 2);
    const dy = (e.clientY - cy) / (window.innerHeight / 2);

    // Sigmoide: nunca clampea duro, no hay tope de pared
    tgtX = smooth(dx) * MAX_X;
    tgtY = smooth(dy) * MAX_Y;
  });

  // Cursor fuera de la ventana → vuelve al centro suavemente (no bruscamente)
  document.addEventListener('mouseleave', () => {
    tgtX = 0;
    tgtY = 0;
  });

  function lerp(a, b, t) { return a + (b - a) * t; }

  function tick() {
    // Factor 0.09: un poco más rápido que el original (0.08) para que
    // se sienta más responsivo sin perder suavidad
    curX = lerp(curX, tgtX, 0.09);
    curY = lerp(curY, tgtY, 0.09);

    // Aplicar directamente al elemento SVG — sin CSS transition encima
    curve.setAttribute('transform',
      `translate(${curX.toFixed(3)}, ${curY.toFixed(3)})`);

    requestAnimationFrame(tick);
  }

  // Arranca después del reveal (2.2s)
  setTimeout(tick, 2200);
</script>
